    .progress-bar-container .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #8B0E0E, #c44d4d, #8B0E0E);
      background-size: 200% 100%;
      animation: progress-shimmer 1.5s infinite linear;
      width: 30%;
      border-radius: 0 2px 2px 0;
      transition: width 0.3s ease;
    }

    .progress-bar-container.active .progress-bar {
      animation: progress-shimmer 1.5s infinite linear, progress-move 2s infinite ease-in-out;
    }

    @keyframes progress-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @keyframes progress-move {
      0% { width: 10%; margin-left: 0; }
      50% { width: 40%; margin-left: 30%; }
      100% { width: 10%; margin-left: 90%; }

    .table-responsive::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 3px;
    }

    .table-responsive::-webkit-scrollbar-thumb:hover {
      background: #9ca3af;
    }

    .badge-status {
      font-size: 0.62rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .offcanvas.form-offcanvas {
      width: 50% !important;
      min-width: 400px;
    }

    .offcanvas.form-offcanvas .offcanvas-header {
      background: linear-gradient(135deg, #8B0E0E 0%, #6d0b0b 100%);
      padding: 16px 24px;
    }

    .offcanvas.form-offcanvas .offcanvas-header .offcanvas-title {
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
    }

    .offcanvas.form-offcanvas .offcanvas-header .btn-close {
      filter: brightness(0) invert(1);
      opacity: 0.7;
    }

    .offcanvas.form-offcanvas .offcanvas-header .btn-close:hover {
      opacity: 1;
    }

    .offcanvas.form-offcanvas .offcanvas-body {
      padding: 20px;
      background: #f8f9fa;
    }

    .offcanvas.form-offcanvas .offcanvas-footer {
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      justify-content: flex-end;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
      gap: 8px;
    }

    @media (max-width: 992px) {
      .offcanvas.form-offcanvas {
        width: 100% !important;
        min-width: unset;
      }

      .banner-wrapper {
        flex-direction: column;
      }

      .banner-container {
        max-width: 100%;
      }

      .banner-container img {
        max-width: 100%;
        height: auto;
      }

      .summary-wrapper {
        max-width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        margin-left: 0;
      }

      .summary-wrapper .dashboard-section {
        flex-direction: row !important;
        flex-wrap: wrap;
        width: 100%;
      }

      .summary-wrapper .summary-card {
        flex: 1 1 calc(50% - 5px);
        min-width: 200px;
      }
    }

    .swal2-popup {
      font-size: 0.9rem !important;
    }

    .summary-card {
      border-radius: 12px;
      padding: 24px 20px;
      min-height: 120px;
      text-align: left;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 16px;
      border: none;
    }

    .summary-card.faturamento {
      background: linear-gradient(to right, #059669, #ffffff);
      color: #059669;
    }

    .summary-card.glosa {
      background: linear-gradient(to right, #d97706, #ffffff);
      color: #d97706;
    }

    .summary-card.perda {
      background: linear-gradient(to right, #8B0E0E, #ffffff);
      color: #8B0E0E;
    }

    .summary-card:hover {
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      transform: translateY(-2px);
    }

    .summary-card .icon-wrapper {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      background: rgba(255, 255, 255, 0.6);
      transition: transform 0.3s ease;
    }

    .summary-card.faturamento .icon-wrapper { color: #059669; }
    .summary-card.glosa .icon-wrapper { color: #d97706; }
    .summary-card.perda .icon-wrapper { color: #8B0E0E; }

    .summary-card:hover .icon-wrapper {
      transform: scale(1.1);
    }

    .summary-card .info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .summary-card .label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .summary-card.faturamento .label { color: #fff; }
    .summary-card.glosa .label { color: #fff; }
    .summary-card.perda .label { color: #fff; }

    .summary-card .value {
      font-size: 1.8rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
      white-space: nowrap;
    }

    .summary-card.faturamento .value { color: #fff; }
    .summary-card.glosa .value { color: #fff; }
    .summary-card.perda .value { color: #fff; }
  </style>
</head>

              <label class="form-label">Título <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="Titulo" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Competência <span class="text-danger">*</span></label>
              <input type="month" class="form-control" id="competencia" required>
            </div>
          </div>

            <div class="col-md-4">
              <label class="form-label">Regional <span class="text-danger">*</span></label>
              <select class="form-select select-busca" id="IdRegional" required>
                <option value=""></option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Unidade <span class="text-danger">*</span></label>
              <select class="form-select select-busca" id="IdUnidade" required>
                <option value=""></option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Hospital <span class="text-danger">*</span></label>
              <select class="form-select select-busca" id="IdHospital" required>
                <option value=""></option>
              </select>
            </div>
          </div>
        </div>

          <div class="section-title">Envio NFe</div>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">NFe</label>
              <input type="text" class="form-control" id="NFe">
            </div>
            <div class="col-md-4">
              <label class="form-label">Data NFe</label>
              <input type="date" class="form-control" id="Data" disabled>
            </div>
            <div class="col-md-4">
              <label class="form-label">Status da NFe <span class="text-danger">*</span></label>
              <select class="form-select select-busca" id="IdStatus" required>
                <option value=""></option>
              </select>
            </div>
          </div>
        </div>

        <div class="row g-3 section-row">
          <div class="col-md-6">
            <div class="section-box h-100">
              <div class="section-title">Glosa</div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Motivo de Glosa <span class="text-danger">*</span></label>
                  <select class="form-select select-busca" id="IdMotivo" required>
                    <option value=""></option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Valor Glosa</label>
                  <input type="text" class="form-control" id="Glosa" inputmode="numeric" disabled>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="section-box h-100">
              <div class="section-title">Faturamento</div>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label">Valor Faturado <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="Faturamento" inputmode="numeric" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Envio Faturamento <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" id="Envio">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Valor Perda</label>
                  <input type="text" class="form-control" id="Perda" inputmode="numeric">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="section-box">
          <div class="section-title">Observações</div>
          <textarea class="form-control" id="Observacao" rows="4"></textarea>

    <div class="container-fluid py-4 px-3 main-container">
